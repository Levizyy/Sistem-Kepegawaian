<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="1000" height="560" fill="#F5F7FB"/>
  <text x="500" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#1A1D29">ERD - Sistem Informasi Kepegawaian</text>
  <text x="500" y="56" text-anchor="middle" font-size="12" fill="#6B7280">Entity Relationship Diagram</text>

  <!-- Tabel USERS -->
  <g>
    <rect x="40" y="90" width="270" height="330" rx="8" fill="#FFFFFF" stroke="#4361EE" stroke-width="2"/>
    <rect x="40" y="90" width="270" height="36" rx="8" fill="#4361EE"/>
    <rect x="40" y="108" width="270" height="18" fill="#4361EE"/>
    <text x="175" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">users</text>

    <text x="55" y="148" font-size="12" font-weight="bold" fill="#1A1D29">PK  id</text>
    <text x="55" y="168" font-size="12" fill="#374151">nama</text>
    <text x="55" y="188" font-size="12" fill="#374151">unit_kerja</text>
    <text x="55" y="208" font-size="12" fill="#374151">email</text>
    <text x="55" y="228" font-size="12" fill="#374151">nomor_hp</text>
    <text x="55" y="248" font-size="12" fill="#374151">role (enum)</text>
    <text x="55" y="268" font-size="12" fill="#374151">password</text>
    <text x="55" y="288" font-size="12" fill="#374151">aktif</text>
    <text x="55" y="308" font-size="12" fill="#374151">created_at</text>
    <text x="55" y="328" font-size="12" fill="#374151">updated_at</text>

    <text x="175" y="405" text-anchor="middle" font-size="10" fill="#9CA3AF">Tabel 1 — Data Pengguna</text>
  </g>

  <!-- Tabel TO_DO_LIST -->
  <g>
    <rect x="365" y="90" width="270" height="400" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
    <rect x="365" y="90" width="270" height="36" rx="8" fill="#16A34A"/>
    <rect x="365" y="108" width="270" height="18" fill="#16A34A"/>
    <text x="500" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">to_do_list</text>

    <text x="380" y="148" font-size="12" font-weight="bold" fill="#1A1D29">PK  nomor</text>
    <text x="380" y="168" font-size="12" font-weight="bold" fill="#16A34A">FK  pemilik</text>
    <text x="380" y="188" font-size="12" fill="#374151">tugas</text>
    <text x="380" y="208" font-size="12" fill="#374151">prioritas (enum)</text>
    <text x="380" y="228" font-size="12" fill="#374151">status (enum)</text>
    <text x="380" y="248" font-size="12" fill="#374151">progres</text>
    <text x="380" y="268" font-size="12" fill="#374151">tanggal_mulai</text>
    <text x="380" y="288" font-size="12" fill="#374151">tanggal_selesai</text>
    <text x="380" y="308" font-size="12" fill="#374151">target_pencapaian</text>
    <text x="380" y="328" font-size="12" fill="#374151">rincian_data</text>
    <text x="380" y="348" font-size="12" fill="#374151">catatan_progres</text>
    <text x="380" y="368" font-size="12" fill="#374151">link_excel</text>

    <text x="500" y="475" text-anchor="middle" font-size="10" fill="#9CA3AF">Tabel 2 — Daftar Tugas Pegawai</text>
  </g>

  <!-- Tabel LOG_AKTIVITAS -->
  <g>
    <rect x="690" y="90" width="270" height="270" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
    <rect x="690" y="90" width="270" height="36" rx="8" fill="#DC2626"/>
    <rect x="690" y="108" width="270" height="18" fill="#DC2626"/>
    <text x="825" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">log_aktivitas</text>

    <text x="705" y="148" font-size="12" font-weight="bold" fill="#1A1D29">PK  id</text>
    <text x="705" y="168" font-size="12" font-weight="bold" fill="#DC2626">FK  user_id</text>
    <text x="705" y="188" font-size="12" fill="#374151">aksi (enum)</text>
    <text x="705" y="208" font-size="12" fill="#374151">keterangan</text>
    <text x="705" y="228" font-size="12" fill="#374151">waktu</text>

    <text x="825" y="345" text-anchor="middle" font-size="10" fill="#9CA3AF">Tabel 3 — Riwayat Aktivitas</text>
  </g>

  <!-- Relasi garis: users -> to_do_list -->
  <line x1="310" y1="168" x2="365" y2="168" stroke="#374151" stroke-width="1.5"/>
  <text x="320" y="160" font-size="11" fill="#374151">1</text>
  <text x="352" y="160" font-size="11" fill="#374151">N</text>

  <!-- Relasi garis: users -> log_aktivitas -->
  <path d="M 310 148 C 500 60, 600 60, 690 168" fill="none" stroke="#374151" stroke-width="1.5"/>
  <text x="320" y="90" font-size="11" fill="#374151">1</text>
  <text x="660" y="160" font-size="11" fill="#374151">N</text>

  <text x="500" y="530" text-anchor="middle" font-size="11" fill="#374151">
    users.id → to_do_list.pemilik (1 user memiliki banyak tugas)
  </text>
  <text x="500" y="548" text-anchor="middle" font-size="11" fill="#374151">
    users.id → log_aktivitas.user_id (1 user memiliki banyak log aktivitas)
  </text>
</svg>
